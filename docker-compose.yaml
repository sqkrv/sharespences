# Run/dev stack AND the production deployment descriptor. `docker compose up
# --build` gives a migrated + seeded app on http://localhost:8080; a server
# deploys this same file with `git pull` + `docker compose up -d --build`.
# ⚠️ Nothing here is dev-only by virtue of living here. A value added below
# reaches production unless it is explicitly parameterized — which is why the
# database password has no default at all and COOKIE_SECURE defaults to true.
# ⚠️ Env lives HERE in the anchor, never under a service: `<<:` merge keys
# are shallow, so an `environment:` on `app:` would replace this whole map
# (dropping DATABASE_URL) instead of adding to it.
x-backend: &backend
  build:
    context: .
    args:
      # Stamps GET /api/v1/version and the «О приложении» card (ADR-0006
      # CalVer). Pass it inline at deploy time — VERSION=v2026.7.4 docker
      # compose up -d --build — rather than pinning it in .env, where the
      # value outlives the release it names and the app then reports a
      # version it is not running. Unset builds report "dev".
      VERSION: ${VERSION:-dev}
  image: sharespences
  environment:
    # ⚠️ The password is REQUIRED, with no default, on purpose. This file is
    # the production deployment descriptor, so any default here is a
    # credential published in a public repository. Set it per deployment in
    # .env (see .env.example); an unset variable then fails the command by
    # name instead of silently starting on a value anyone can read.
    # ⚠️ It is interpolated into a URL, so it must be URL-safe — a password
    # containing @ : / ? # or % truncates or corrupts the DSN rather than
    # failing loudly. `openssl rand -hex 24` is safe by construction.
    # The user and database name are not secrets and keep defaults; they are
    # shared with the `db` service below so the two can never drift apart.
    DATABASE_URL: postgres://${POSTGRES_USER:-sharespences}:${POSTGRES_PASSWORD:?set it in .env, see .env.example}@db:5432/${POSTGRES_DB:-sharespences}
    # ⚠️ Defaults to TRUE, and must stay that way. This same file is the
    # production deployment descriptor (`git pull` + `docker compose up -d
    # --build`), so a `:-false` default here silently ships a session cookie
    # without the Secure flag to a real deployment — the variable is injected
    # unconditionally, which overrides the binary's own secure-by-default.
    # For local http, where Safari refuses to store a Secure cookie and login
    # then fails with no visible error, opt out per-machine instead:
    #   echo COOKIE_SECURE=false >> .env
    COOKIE_SECURE: ${COOKIE_SECURE:-true}
    # Screenshot recognizer (README «Screenshot recognizer») — off unless
    # VISION_BACKEND is set in the environment / .env. host.docker.internal
    # reaches an Ollama on the Docker host (extra_hosts below).
    VISION_BACKEND: ${VISION_BACKEND:-}
    VISION_MODEL: ${VISION_MODEL:-}
    OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    # Admin sidecar (ADR-0008): all interfaces INSIDE the container so the
    # loopback-only port publish below can reach it; the binary's own default
    # is 127.0.0.1:8081 for native runs. Other services ignore this var.
    ADMIN_LISTEN_ADDR: :8081

# Restart policies are set per service, deliberately not on the anchor above:
# the anchor is shared with the two one-shots, which must never restart. The
# long-running services take `unless-stopped` so the stack comes back after a
# host reboot — this same file is the production deployment descriptor — while
# a deliberate `docker compose stop` for maintenance stays stopped across one.
# `always` would instead bring the app back up mid-maintenance, against a
# database an upgrade had only half finished. Either policy acts on process
# exit and daemon start only: Docker does not restart a container because its
# healthcheck reports unhealthy, so a hung-but-running process still needs a
# human.
services:
  db:
    image: postgis/postgis:18-3.6 # same image as the e2e tests
    restart: unless-stopped
    environment:
      # Same variables as the DSN above — one source, so the role the cluster
      # is created with and the role the app connects as cannot drift.
      # ⚠️ These are read by the image at initdb ONLY. On an existing volume
      # they are ignored, so changing the password here does not change it in
      # the cluster — rotating it means an ALTER ROLE inside the cluster and
      # a recreate of the services that hold the DSN.
      POSTGRES_USER: ${POSTGRES_USER:-sharespences}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env, see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-sharespences}
    # The DB host port is NOT published: app/migrate/seed reach it over the
    # internal network (db:5432), and publishing 5432 collides with any
    # Postgres already on the host (e.g. on the server). For host access
    # during native dev, docker-compose.override.yaml publishes it locally.
    volumes:
      # Mount the PARENT, not .../data: since 18 these images keep the cluster
      # in a major-version subdirectory (/var/lib/postgresql/18/docker), so a
      # mount on the old path is silently unused — the container refuses to
      # start when it finds a previous cluster sitting there, and would
      # otherwise have written to the container filesystem. The single parent
      # mount is also what lets `pg_upgrade --link` work across a major bump
      # without crossing a mount boundary.
      - db-data:/var/lib/postgresql
    healthcheck:
      # TCP check (-h): the initdb-phase temp server listens on the unix
      # socket only, so plain pg_isready would pass too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U sharespences -d sharespences"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *backend
    command: ["migrate"]
    # One-shot. Quoted because a bare `no` is YAML's boolean false rather than
    # the policy name — and a one-shot that restarts never reports "completed
    # successfully", which is precisely what its dependents wait on, so the
    # whole stack would hang instead of coming up.
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  seed: # idempotent reference data (banks, КБ programs) — safe to re-run
    <<: *backend
    command: ["seed"]
    restart: "no" # one-shot, as above
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    <<: *backend
    restart: unless-stopped
    # Published host port; override with APP_PORT (env or .env), e.g.
    # APP_PORT=9090. The container always listens on 8080 internally, so the
    # healthcheck below and the internal network are unaffected.
    ports:
      - "${APP_PORT:-8080}:8080"
    # Lets the container reach an Ollama running on the Docker host
    # (no-op on Docker Desktop, needed on Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - attachments:/data/attachments
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/v1/version"]
      interval: 30s
      timeout: 3s
      retries: 3

  admin:
    <<: *backend
    entrypoint: ["/usr/local/bin/sharespences-admin"]
    restart: unless-stopped
    # The loopback publish IS the access control (ADR-0008): the operator
    # reaches the panel through an SSH tunnel; nothing is exposed publicly.
    # Never widen this to a plain "8081:8081".
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8081}:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
  attachments:
