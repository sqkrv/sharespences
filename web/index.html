<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: standalone PWA draws edge-to-edge; safe-area
         insets (navbar bottom padding, shell top padding) are only non-zero
         with it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0f0b1c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sharespences" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Sharespences</title>
    <script>
      // Theme before first paint (no FOUC): stored override wins; otherwise
      // follow the system, falling back to DARK when the OS expresses no
      // light preference (dark-first, docs/design/ui-preferences.md).
      // theme-color follows for the standalone-PWA status bar / title bar.
      (function () {
        var t = localStorage.getItem("theme");
        var dark =
          t === "dark" ||
          (t !== "light" && !window.matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.classList.toggle("dark", dark);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#0f0b1c" : "#f2f0f8");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
